<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is not cosmetic and it is not optional.

      Without it iOS Safari reports every env(safe-area-inset-*) as 0. So every
      safe-area rule this app has ever shipped — the tab bar's bottom padding, the
      action bar's calc() offset — has been a no-op on the exact devices it was
      written for, while rendering correctly in a desktop Chromium where those insets
      are legitimately 0. That is the whole "it looked fine in my screenshots" failure
      mode: the code was right and the platform was never being asked.

      With it, the layout extends into the safe area and the env() values become real,
      which is what the padding below the tab bar has always been waiting for.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>What's Good — Find your next great meal</title>
    <meta name="description" content="What's Good finds restaurants near you by mood, budget, and distance — or helps you pick a recipe for a night in." />
    <meta property="og:title" content="What's Good" />
    <meta property="og:description" content="Find a place to eat by mood, budget, and distance — or stay in and cook." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="What's Good" />
    <!--
      Installability and the home-screen mark.

      Two separate systems, and iOS uses neither the way you would expect:

      - Android/Chrome reads manifest.webmanifest. Without it there is no install
        prompt at all and the site is only ever a bookmark.
      - iOS Safari IGNORES the manifest's icons for "Add to Home Screen" and reads
        apple-touch-icon. With no such tag it screenshots the page and uses THAT as the
        icon, which is why an un-tagged PWA lands on the home screen looking unfinished.

      Every icon lives under /assets/ ON PURPOSE. vercel.json rewrites all paths to "/"
      except sw.js, registerSW.js, manifest.webmanifest and assets/ — so an icon at the
      root would be served index.html and silently fail to render on every device. That
      directory is also cached immutable for a year, hence the -vN filenames: a new icon
      must arrive under a NEW name or installed devices keep the old one forever.

      No service worker is involved. Installability does not require one (CLAUDE.md §12 —
      the precaching worker made three deploys invisible and must never come back).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon-v1.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192-v1.png" />
    <!--
      theme-color tints the browser's own chrome — the bar iOS Safari draws above and
      below the page. It was a single hardcoded terracotta, so in dark mode the app was
      near-black (#0F0C0A) while Safari's chrome stayed a saturated brown: a band of a
      completely different colour welded to the edge of the app, which is precisely the
      seam a user reads as "the app does not reach the edge of the screen".

      Two tags with media queries, matching the two canvases exactly, so the browser
      chrome and the app become one continuous surface in either mode.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F4F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E0D" />

    <!--
      Without color-scheme the UA renders its own furniture — scrollbars, form controls,
      the overscroll/rubber-band area — in light mode regardless of the app's theme. In a
      dark app that shows as a white scrollbar and a white flash when you overscroll past
      the top: more edges that do not belong to the app.
    -->
    <meta name="color-scheme" content="light dark" />
    <!--
      The typeface is SELF-HOSTED. It used to come from fonts.googleapis.com, which
      made this app's entire visual identity depend on a third party answering a
      request from a phone on a street. Three consequences, all of them shipped:

      1. `display=swap` guarantees a FLASH OF FALLBACK TEXT on every cold load — the
         page paints in the system sans, then reflows into Schibsted Grotesk when the
         font lands. Different metrics, so lines re-wrap and blocks jump. That visible
         jolt on first paint is a large part of why this reads as unfinished.
      2. Two extra DNS+TLS round trips to another origin before any text is right.
      3. Google Fonts receives the user's IP on every load — held to breach GDPR in
         Germany (LG München I, 3 O 17493/20). A food app has no reason to do that.

      The faces are declared in src/index.css and the files live in public/fonts/.
      Do not put the Google links back — checks.mjs fails the build if that host
      reappears.

      These two preloads are what make the real typeface present on FIRST PAINT.
      The faces are declared `font-display: optional`, which never reflows the page
      but also keeps the fallback for the whole page view if the font misses its
      window — and without a preload it misses on every cold load, which was
      measured here. A preload starts the fetch at highest priority alongside the
      CSS, so the window is met and a first-time visitor sees the app's own face
      rather than the system sans. Only the two LATIN faces are preloaded: they
      cover this UI's text, and the latin-ext pair is fetched on demand only when
      the page actually contains a character in that range.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-latin-wght-italic.woff2"
      crossorigin
    />
  </head>
  <body>
    <div class="wrap">
      <header>
        <span class="logo">What's Good</span>
        <div class="hctrl">
          <select class="sel" id="city" aria-label="City"></select>
          <select class="sel" id="hour" aria-label="Hour"></select>
          <button class="icb" id="t" title="Theme" aria-label="Switch colour theme"><svg id="tico" viewBox="0 0 24 24"></svg></button>
        </div>
      </header>

      <div class="tabs" role="tablist" id="tabs"></div>

      <div class="browse">
        <div class="hero ph" id="hero"><div class="in">
          <p class="kick"><i></i><span id="ctx"></span></p>
          <h1 id="h1"></h1><p id="hsub"></p></div></div>

        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="visually-hidden" for="q">Search</label>
          <input id="q" placeholder="Somewhere quiet for two" autocomplete="off">
          <button id="go">Search</button>
        </div>
        <div class="parsed" id="parsed"></div>

        <div class="time" id="time"><div class="glide" id="glide"></div></div>

        <div class="stage" data-v="d" id="stage">
          <div>
            <p class="lbl"><b id="lbl">The occasion</b><span id="why"></span></p>
            <div class="grid" id="grid"></div>
            <div class="refine" id="refine">
              <div class="sliders">
                <div class="sl"><label for="dist"><b>How far</b><span id="o-dist">2.0 km</span></label>
                  <input type="range" id="dist" min="0" max="6" step="1" value="2"></div>
                <div class="sl"><label for="price"><b>Spend</b><span id="o-price">Mid</span></label>
                  <input type="range" id="price" min="0" max="3" step="1" value="1"></div>
                <div class="sl"><label for="party"><b>Table for</b><span id="o-party">2</span></label>
                  <input type="range" id="party" min="1" max="8" step="1" value="2"></div>
              </div>
              <div style="margin-top:24px"><p class="lbl"><b>Nearby</b><span id="geo"></span></p>
                <div class="chips" id="areas"></div></div>
            </div>
          </div>
          <div class="res">
            <div class="rhead"><b id="rt">Nothing picked yet</b><span id="rc"></span></div>
            <!--
              Why a list is not what it should be. Empty and display:none until a search
              actually falls back off Google Places, at which point it names the cause —
              unset key, rejected key, spent quota, unreachable — because those are four
              different problems with four different fixes, and collapsing them into one
              silent screen is what left "the restaurants aren't working and they're not
              showing pics" undiagnosable for two sessions.
            -->
            <p class="srcnote" id="srcnote" style="display:none"></p>
            <div id="list"><p class="empty">Pick an occasion, or just type what you're after.</p></div>
          </div>
        </div>
      </div>

      <div class="detail" id="detail"></div>

      <p class="note">Place data powered by Google</p>
    </div>
    <script type="module" src="/src/prototype.ts"></script>
  </body>
</html>
