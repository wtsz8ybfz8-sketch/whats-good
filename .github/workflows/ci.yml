# The type gate this project never actually had.
#
# `npm run lint` (tsc --noEmit) is pathologically slow on the author's machine — many
# minutes at ~0% CPU, frequently never finishing — so in practice it was never run.
# `npm run build` is `vite build`, which does no typechecking at all. The result: no
# type error has ever been caught by anything, on any machine, before this file.
#
# A clean runner does the same work in well under a minute. That is the whole idea:
# move the gate off the machine where it doesn't work, onto one where it does.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run pointless — cancel it rather
# than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the handover check asks whether the commit HANDOVER.md names is an
      # ancestor of HEAD, which a depth-1 checkout cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # HANDOVER.md is read by the next session as authoritative state. It once named a
      # commit two behind HEAD, which is a silent way to send a session to redo finished
      # work. Fails only when the named commit is missing or is not an ancestor of HEAD;
      # code landing after it is reported, since the handover is necessarily written
      # before the commit that carries it.
      - name: Handover names a real, current commit
        run: node verify/handover-commit.mjs --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate. Runs tsc --noEmit — the check that has never completed locally.
      # Prose rules get skimmed; this one cannot be. Every source file must be declared
      # in INSPECTION-LEDGER.md, so an untracked surface — the thing that let a dead tab
      # and invented recipe timings reach the user — fails the build instead of hiding.
      - name: Every source file is declared in the inspection ledger
        run: node verify/ledger-check.mjs

      - name: Typecheck
        run: npm run lint

      # Bundling is a separate failure mode from typing: vite can fail on a bad import
      # or an asset path that tsc is perfectly happy with.
      - name: Build
        run: npm run build

      # The regression suite. Every check in it corresponds to a defect that SHIPPED and
      # was found by the user rather than by any check. Running it here means it runs
      # whether or not an agent remembers to.
      # playwright-core ships no browser, and until 2026-07-27 this step pointed at
      # /opt/pw-browsers/chromium-1194 — the agent container's path, absent on a runner.
      # So the launch threw on EVERY run: the 9 static checks ran, the browser half
      # never did, and the claim that these checks run "whether or not an agent
      # remembers" was false for the life of the file. Install a real browser.
      - name: Install Chromium for the harness
        run: npx --yes playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

      - name: Regression checks (verify/checks.mjs)
        run: |
          npm --prefix verify ci || npm --prefix verify install
          VITE_GOOGLE_PLACES_KEY=ci-fixture-key npx vite --port 3000 &
          npx wait-on -t 60000 http://localhost:3000/ || sleep 10
          node verify/checks.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

      # The same suite, on the engine the USER's phone actually runs.
      #
      # Every measurement this project has ever made was headless Chromium, which
      # reports the CORRECT value for every iOS-shaped bug this app has shipped:
      # safe-area insets, the URL-bar-hidden viewport behind `vh`, backdrop-filter
      # scheduling. CLAUDE.md §13.2 lists "iOS Safari behaviour of any kind" as
      # unverifiable, and it has been true for the project's whole life — WebKit cannot
      # be installed in the agent container (the proxy blocks the Playwright CDN,
      # re-confirmed 2026-07-28). A runner installs it in seconds. This is the only
      # place WebKit has ever rendered this app.
      #
      # WebKit on Linux is not Safari on iOS: same engine and same viewport/safe-area/
      # backdrop-filter semantics, different OS and no real device chrome. It closes
      # most of the gap, not all of it. Report it as "WebKit", never as "iOS".
      #
      # continue-on-error is deliberate AND TEMPORARY. This engine has never run against
      # this app, so its arrival state is genuinely unknown; a step that is red on
      # arrival for unknown reasons is the variant that teaches everyone to ignore the
      # pipeline. It is an OBSERVATION channel until one green run exists — then flip
      # this to a gate and delete this paragraph. Note what is NOT softened: a WebKit
      # that fails to LAUNCH exits 3 from browser.mjs and is recorded as such, because a
      # suite that quietly drops its browser reports green while measuring nothing.
      - name: WebKit render sweep (observation, not yet a gate)
        continue-on-error: true
        run: |
          npx --yes playwright install --with-deps webkit
          echo "### WebKit (${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
          if PW_ENGINE=webkit node verify/checks.mjs 2>&1 | tee webkit.log ; then
            echo "- WebKit suite: **passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- WebKit suite: **FAILED or did not launch** — see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '✗|⚠|checks passed|SKIPPED' webkit.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Screenshots from WebKit at the user's real phone width, downloadable from the
      # run. "Anything visible must be looked at before you claim it works" (§6) has
      # meant looking at a Chromium picture of a WebKit app. These are the real thing.
      - name: WebKit screenshots at 393x852
        continue-on-error: true
        run: |
          PW_ENGINE=webkit node verify/driver.mjs || true
          PW_ENGINE=webkit node verify/driver.mjs --dark || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-screenshots
          path: verify/out/*.png
          if-no-files-found: warn

      # --- Guards for rules CLAUDE.md states as prose and nothing enforces ---
      #
      # These exist because a written rule that only an agent reads is a rule that gets
      # broken on a tired afternoon. Each one below has actually been violated in this
      # repo's history, which is why it earned a check rather than a paragraph.

      # §7: translucent chrome is expensive and belongs on chrome only. On a card it puts
      # backdrop-filter cost on every row of a scrolling list, which is the regression the
      # old .surface classes existed to prevent.
      #
      # THIS CHECK USED TO GREP src/components AND src/App.tsx. Neither has existed since
      # 206fe11 ("Transplant the prototype: it is now the app") deleted the React tree.
      # grep on a missing path prints nothing, `|| true` swallowed the exit code, the
      # count came back 0, and the step reported "OK — .glass on 0 chrome surface(s)" on
      # every run. It was green because it was looking at nothing.
      #
      # `.glass` has no successor class in prototype.css, and the bare word `glass` now
      # means something else entirely — it is the wine-glass ICON path for the cocktails
      # occasion (prototype.ts:66). Repointing the old grep at src/ would have fired on an
      # icon and taught everyone to ignore the step.
      #
      # So the SUBJECT changes and the RULE survives: the cost this rule was always about
      # is backdrop-filter, and prototype.css currently uses it zero times. Ceiling 0 —
      # translucency comes back only as a deliberate decision, never by drift.
      - name: No backdrop-filter drift (§7)
        run: |
          hits=$(grep -rnE 'backdrop-filter' src || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::backdrop-filter appeared in src/. It is chrome-only and costs a repaint on every row of a scrolling list (§7). If this is deliberate chrome, raise the ceiling in this step and say why."
            exit 1
          fi
          echo "OK — no backdrop-filter in src/"

      # §12: vite-plugin-pwa precached index.html, so three sessions of work deployed and
      # were invisible on the live URL. public/sw.js is now a self-destructing kill switch
      # and must stay. What must never come back is a plugin that registers a NEW worker.
      # Matches real wiring only — an import or a VitePWA() call — so the explanatory
      # comment currently sitting in vite.config.ts does not trip it.
      - name: No service worker plugin in the build
        run: |
          if grep -nE "^[^/]*(from '.*vite-plugin-pwa'|VitePWA\()" vite.config.ts ; then
            echo "::error::vite-plugin-pwa is wired into vite.config.ts. It precaches index.html and makes deploys invisible (§12)."
            exit 1
          fi
          echo "OK — no PWA plugin wired into vite.config.ts"

      # §13.2/§13.3: rules stated as absolutes in CLAUDE.md that nothing could fail.
      #
      # Each is a RATCHET, not a pass/fail: the current count is the ceiling, so the
      # pipeline is green on arrival but a NEW violation turns it red. That is the only
      # shape that works for debt a blocking gate would make permanently red — the
      # variant that teaches everyone to ignore the pipeline.
      #
      # Lower a baseline whenever you remove a violation. Never raise one.
      - name: Structural ratchets (§13)
        run: |
          fail=0
          ratchet() {
            name="$1"; baseline="$2"; count="$3"
            echo "$name: $count (ceiling $baseline)"
            echo "- $name: **$count** / ceiling $baseline" >> "$GITHUB_STEP_SUMMARY"
            if [ "$count" -gt "$baseline" ]; then
              echo "::error::$name went up: $count > $baseline. See CLAUDE.md §13."
              fail=1
            fi
          }
          echo "### Structural ratchets (§13)" >> "$GITHUB_STEP_SUMMARY"

          # NOTE: there is deliberately NO openNow ratchet. The audit that added this
          # step flagged 4 sites, then reading them showed all 4 sit inside an outer
          # `openNow !== undefined` guard — the code was already correct and the grep
          # could not see the guard. A grep cannot distinguish a guarded ternary from a
          # bare one, so this rule stays agent-discipline only (§13.2) rather than
          # shipping a check that fires on correct code.

          # EVERY RATCHET BELOW USED TO READ --include='*.tsx'. There have been ZERO .tsx
          # files in this repo since 206fe11 transplanted the prototype over the React
          # app. grep matched nothing, `|| true` swallowed it, every count came back 0,
          # and all four ratchets reported green for weeks while measuring an empty set.
          # Meanwhile a real hand-formatted distance shipped and was read by users as
          # "2.0 km" in locales that write "2,0". The ceilings below are measured against
          # the files that actually exist.

          # §6 — src/locale.ts is the ONLY module allowed to format for a human reader.
          # toFixed is a serialiser: it always emits "." and always pads. Ceiling 0, and
          # verify/checks.mjs asserts the same rule independently so it holds with or
          # without a browser. locale.ts is exempt — the Intl calls and their fallbacks
          # live there.
          c=$(grep -rnoE '\.toFixed\(' src --include='*.ts' \
                | grep -v '^src/locale.ts' | grep -c . || true)
          ratchet "hand-formatted numbers outside locale.ts (§6)" 0 "$c"

          # §7 — colour comes from the tokens on :root in prototype.css. The count only
          # means anything if token DEFINITIONS are excluded, or the palette scores as its
          # own worst violation and the ceiling gets raised to hide it. sed strips the
          # `--name:#hex` pairs, then what remains is a genuine hardcode.
          #
          # The 4 that remain are worth naming, because two of them are a live trap:
          #   prototype.css:337,347  color:#FFF on a photo hero — should be a token
          #   prototype.ts:809       the theme-color meta tint, hardcoded #0E0E0D/#F5F4F2
          # Those last two DUPLICATE the --bg token's value in each mode. Change the
          # canvas token and the browser chrome silently keeps the old tint — which is
          # precisely the "band of the wrong colour welded to the screen edge" bug in
          # CLAUDE.md's trap register, rebuilt from parts.
          c=0
          for f in src/prototype.css src/prototype.ts; do
            n=$(sed -E 's/--[a-zA-Z0-9-]+:[[:space:]]*#[0-9a-fA-F]{3,8}//g' "$f" \
                  | grep -oE '#[0-9a-fA-F]{3,8}\b' | grep -c . || true)
            c=$((c + n))
          done
          ratchet "hardcoded hex outside token definitions (§7)" 4 "$c"

          # RETIRED, deliberately, rather than left green over nothing:
          #
          # - "hardcoded bottom-chrome offsets" matched the Tailwind form `bottom-[64px]`
          #   and derived from --tabbar-h. The prototype has no fixed bottom chrome and no
          #   --tabbar-h token; its tab strip sits in flow at the top. No subject.
          # - "full-strength black borders" matched the Tailwind class `border-black`.
          #   prototype.css has zero of those and zero #000 borders. No subject.
          #
          # Both rules were about Tailwind utilities. Tailwind is still wired into
          # vite.config.ts but NO stylesheet imports it, so it emits nothing — see the
          # open questions in CLAUDE.md §13.3. Re-add these the day a utility layer
          # returns; do not leave a grep running against a syntax the codebase dropped.

          exit $fail
