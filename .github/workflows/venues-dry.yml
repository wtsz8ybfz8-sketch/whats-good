# TEMPORARY: proves the enriched venue build on the redesign branch without committing data.
# Deleted before merge.
name: Venue data dry run
on:
  push:
    branches: [redesign]
    paths: ['scripts/build_venues.py', '.github/workflows/venues-dry.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb==1.1.3
      - run: python scripts/build_venues.py
      - name: Commit data to this branch (preview only)
        run: |
          git config user.name "venue-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && exit 0
          git commit -m "Preview: enriched venue data"
          git pull --rebase origin redesign && git push origin HEAD:redesign
